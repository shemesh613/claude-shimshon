<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ארמון המלוכה התלת-מימדי - חדר הנסיכה</title>
    <!-- Tailwind CSS for UI controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera manipulation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .gold-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay / Control Panel -->
    <div class="absolute top-4 right-4 z-10 flex flex-col gap-3 w-80 max-w-[90vw]">
        <div class="glass-panel p-5 rounded-2xl shadow-2xl text-white">
            <h1 class="text-2xl font-bold text-yellow-400 gold-glow mb-1 text-center">👑 ארמון המלוכה</h1>
            <p class="text-xs text-slate-300 text-center mb-4">הדמיית תלת-ממד אינטראקטיבית</p>
            
            <div class="space-y-2">
                <label class="text-xs font-semibold text-yellow-200 block">בחר מבט / קומה:</label>
                <button onclick="focusView('whole')" class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-white font-medium rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm">
                    🏛️ מבט על כל הארמון
                </button>
                <button onclick="focusView('princess')" class="w-full py-2.5 px-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-medium rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm">
                    ✨ החדר הפרטי של הנסיכה
                </button>
                <button onclick="focusView('tower')" class="w-full py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-medium rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm">
                    🏰 מגדל ראשי
                </button>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-700/60 text-xs text-slate-400 text-center">
                <p>טיפ: גרור עם העכבר לסיבוב, גלול לקירוב/תרחוק.</p>
            </div>
        </div>
    </div>

    <!-- Bottom Notification Banner -->
    <div id="info-banner" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 glass-panel px-6 py-3 rounded-full text-white text-sm shadow-xl transition-all duration-500 opacity-90 pointer-events-none">
        ✨ ברוכים הבאים לארמון המלכותי! לחצו על הכפתורים לניווט מהיר.
    </div>

    <script>
        // Global variables for Three.js scene, camera, renderer, controls, and animation targets
        let scene, camera, renderer, controls;
        let palaceGroup, princessRoomGroup, princessGroup, particleSystem;
        
        // Target camera states for smooth transitions
        let targetCameraPos = new THREE.Vector3(0, 35, 90);
        let targetLookAt = new THREE.Vector3(0, 15, 0);
        let isTransitioning = false;
        let transitionProgress = 1;

        // Initialize scene on window load
        window.onload = function() {
            initScene();
            createLighting();
            createEnvironment();
            createPalace();
            createMagicParticles();
            
            // Event listener for window resizing
            window.addEventListener('resize', onWindowResize, false);
            
            // Start animation loop
            animate();
        };

        function initScene() {
            const container = document.getElementById('canvas-container');
            
            // Scene setup with atmospheric dark twilight fog
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070913);
            scene.fog = new THREE.FogExp2(0x070913, 0.008);

            // Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 90);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01; // Don't go below ground
            controls.minDistance = 10;
            controls.maxDistance = 200;
            controls.target.set(0, 15, 0);
        }

        function createLighting() {
            // Ambient light for general soft illumination
            const ambientLight = new THREE.AmbientLight(0x1a233a, 1.2);
            scene.add(ambientLight);

            // Main directional moonlight
            const moonLight = new THREE.DirectionalLight(0x8cb4ff, 1.5);
            moonLight.position.set(50, 80, 50);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 300;
            const d = 60;
            moonLight.shadow.camera.left = -d;
            moonLight.shadow.camera.right = d;
            moonLight.shadow.camera.top = d;
            moonLight.shadow.camera.bottom = -d;
            scene.add(moonLight);

            // Warm magical point lights around the palace
            const pointLight1 = new THREE.PointLight(0xffaa33, 2, 50);
            pointLight1.position.set(0, 22, 15);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff66cc, 2, 40); // Princess room pink glow
            pointLight2.position.set(-14, 23, 0);
            scene.add(pointLight2);
        }

        function createEnvironment() {
            // Starry sky background
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 1200;
            const starPositions = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 500;
                starPositions[i + 1] = Math.random() * 250 + 20;
                starPositions[i + 2] = (Math.random() - 0.5) * 500;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8 });
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);

            // Grand Ground / Terrain
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x0f172a, 
                roughness: 0.8, 
                metalness: 0.2 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Glowing castle foundation platform
            const baseGeo = new THREE.CylinderGeometry(45, 50, 4, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 2;
            base.receiveShadow = true;
            base.castShadow = true;
            scene.add(base);

            // Foundation glowing ring
            const ringGeo = new THREE.TorusGeometry(46, 0.4, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 4.1;
            scene.add(ring);
        }

        function createPalace() {
            palaceGroup = new THREE.Group();

            // Materials for palace architecture
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4, metalness: 0.1 });
            const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x4f46e5, roughness: 0.3, metalness: 0.4 }); // Royal Indigo/Blue roofs
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.2, metalness: 0.8 });
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8, roughness: 0.1 });
            const princessWallMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.3 }); // Soft pink for princess suite

            // --- Floor 1: Grand Hall ---
            const floor1Geo = new THREE.BoxGeometry(40, 8, 30);
            const floor1 = new THREE.Mesh(floor1Geo, wallMat);
            floor1.position.y = 8;
            floor1.castShadow = true;
            floor1.receiveShadow = true;
            palaceGroup.add(floor1);

            // Grand Entrance Arch
            const archGeo = new THREE.CylinderGeometry(4, 4, 7, 16, 1, false, 0, Math.PI);
            const arch = new THREE.Mesh(archGeo, darkStoneMat);
            arch.rotation.z = Math.PI / 2;
            arch.position.set(0, 6, 15.1);
            palaceGroup.add(arch);

            // Front door
            const doorGeo = new THREE.BoxGeometry(6, 7, 0.5);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.6 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 5.5, 15.15);
            palaceGroup.add(door);

            // --- Floor 2: Royal Chambers & Balconies ---
            const floor2Geo = new THREE.BoxGeometry(34, 7, 26);
            const floor2 = new THREE.Mesh(floor2Geo, wallMat);
            floor2.position.y = 15.5;
            floor2.castShadow = true;
            floor2.receiveShadow = true;
            palaceGroup.add(floor2);

            // Grand Balcony
            const balconyBaseGeo = new THREE.BoxGeometry(18, 0.8, 6);
            const balconyBase = new THREE.Mesh(balconyBaseGeo, darkStoneMat);
            balconyBase.position.set(0, 12.5, 16);
            balconyBase.castShadow = true;
            palaceGroup.add(balconyBase);

            // Balcony railing pillars
            for (let i = -8; i <= 8; i += 2) {
                const railGeo = new THREE.CylinderGeometry(0.2, 0.2, 2, 8);
                const rail = new THREE.Mesh(railGeo, goldMat);
                rail.position.set(i, 13.8, 18.8);
                palaceGroup.add(rail);
            }

            // --- Floor 3: The Princess's Majestic Private Room ---
            princessRoomGroup = new THREE.Group();
            
            // Princess suite walls (pinkish regal tint)
            const pRoomGeo = new THREE.BoxGeometry(22, 6, 18);
            const pRoom = new THREE.Mesh(pRoomGeo, princessWallMat);
            pRoom.position.set(0, 21.5, 0);
            pRoom.castShadow = true;
            pRoom.receiveShadow = true;
            princessRoomGroup.add(pRoom);

            // Magical glowing arch windows for the princess room
            const pWindowGeo = new THREE.CylinderGeometry(2.5, 2.5, 1, 16, 1, false, 0, Math.PI);
            const pWindow1 = new THREE.Mesh(pWindowGeo, windowMat);
            pWindow1.rotation.z = Math.PI / 2;
            pWindow1.position.set(0, 23, 9.1);
            princessRoomGroup.add(pWindow1);

            // Princess Balcony
            const pBalconyGeo = new THREE.BoxGeometry(12, 0.6, 5);
            const pBalcony = new THREE.Mesh(pBalconyGeo, goldMat);
            pBalcony.position.set(0, 19.5, 11.5);
            princessRoomGroup.add(pBalcony);

            // --- Interior: Canopy Bed & Glowing Crystals ---
            // Canopy Bed Base
            const bedBaseGeo = new THREE.BoxGeometry(5, 1.2, 7);
            const bedMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.4 }); // Velvet red mattress
            const bedBase = new THREE.Mesh(bedBaseGeo, bedMat);
            bedBase.position.set(-5, 19.1, -3);
            princessRoomGroup.add(bedBase);

            // Bed Canopy Posts
            for (let dx of [-2.3, 2.3]) {
                for (let dz of [-3.2, 3.2]) {
                    const postGeo = new THREE.CylinderGeometry(0.15, 0.15, 4, 8);
                    const post = new THREE.Mesh(postGeo, goldMat);
                    post.position.set(-5 + dx, 21.2, -3 + dz);
                    princessRoomGroup.add(post);
                }
            }

            // Canopy Top Roof
            const canopyTopGeo = new THREE.BoxGeometry(5.2, 0.4, 7.2);
            const canopyTop = new THREE.Mesh(canopyTopGeo, new THREE.MeshStandardMaterial({ color: 0xec4899 }));
            canopyTop.position.set(-5, 23.3, -3);
            princessRoomGroup.add(canopyTop);

            // Floating Glowing Crystals in Princess Room
            const crystalGeo = new THREE.OctahedronGeometry(0.8);
            const crystalMat = new THREE.MeshStandardMaterial({ 
                color: 0xf43f5e, 
                emissive: 0xf43f5e, 
                emissiveIntensity: 0.9, 
                roughness: 0.1, 
                transparent: true, 
                opacity: 0.9 
            });
            for (let i = 0; i < 3; i++) {
                const crystal = new THREE.Mesh(crystalGeo, crystalMat);
                crystal.position.set(4 + i * 1.5, 22 + Math.sin(i) * 1.5, -2 + i * 2);
                princessRoomGroup.add(crystal);
            }

            // --- Princess Avatar ---
            princessGroup = new THREE.Group();
            
            // Dress (Flowing elegant gown)
            const dressGeo = new THREE.ConeGeometry(1.8, 4.5, 16);
            const dressMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.3, metalness: 0.2 });
            const dress = new THREE.Mesh(dressGeo, dressMat);
            dress.position.set(3, 20.2, 2);
            dress.castShadow = true;
            princessGroup.add(dress);

            // Torso & Upper body
            const torsoGeo = new THREE.CylinderGeometry(0.6, 0.9, 1.8, 16);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0xfff1f2 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.set(3, 23, 2);
            princessGroup.add(torso);

            // Head
            const headGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.5 }); // Golden hair / skin tone
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(3, 24.2, 2);
            princessGroup.add(head);

            // Royal Crown
            const crownGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.5, 8);
            const crown = new THREE.Mesh(crownGeo, goldMat);
            crown.position.set(3, 24.9, 2);
            princessGroup.add(crown);

            princessRoomGroup.add(princessGroup);
            palaceGroup.add(princessRoomGroup);

            // --- Main Towers (4 Corners) ---
            const towerGeo = new THREE.CylinderGeometry(4.5, 5, 32, 24);
            const roofConeGeo = new THREE.ConeGeometry(5.5, 12, 24);

            const towerPositions = [
                [-16, -12], [16, -12], [-16, 12], [16, 12]
            ];

            towerPositions.forEach(pos => {
                const tower = new THREE.Mesh(towerGeo, wallMat);
                tower.position.set(pos[0], 16, pos[1]);
                tower.castShadow = true;
                tower.receiveShadow = true;
                palaceGroup.add(tower);

                const roof = new THREE.Mesh(roofConeGeo, roofMat);
                roof.position.set(pos[0], 38, pos[1]);
                roof.castShadow = true;
                palaceGroup.add(roof);
            });

            scene.add(palaceGroup);
        }

        function createMagicParticles() {
            const particleCount = 200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const scales = new Float32Array(particleCount);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 60;
                positions[i + 1] = Math.random() * 40 + 5;
                positions[i + 2] = (Math.random() - 0.5) * 60;
                scales[i / 3] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 220, 100, 1)');
            gradient.addColorStop(0.5, 'rgba(244, 63, 94, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.PointsMaterial({
                size: 1.5,
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // Camera focus view switcher - defined globally so onclick handlers can access it
        window.focusView = function(type) {
            isTransitioning = true;
            transitionProgress = 0;

            const banner = document.getElementById('info-banner');

            if (type === 'whole') {
                targetCameraPos.set(0, 35, 90);
                targetLookAt.set(0, 15, 0);
                banner.innerText = "🏛️ מבט כולל על ארמון המלוכה הענק";
            } else if (type === 'princess') {
                targetCameraPos.set(3, 23, 22);
                targetLookAt.set(0, 22, 0);
                banner.innerText = "✨ בחדרה הפרטי והקסום של הנסיכה";
            } else if (type === 'tower') {
                targetCameraPos.set(35, 30, 35);
                targetLookAt.set(0, 20, 0);
                banner.innerText = "🏰 מבט אל מגדלי הפאר המלכותיים";
            }
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (princessGroup) {
                princessGroup.position.y = Math.sin(elapsedTime * 2) * 0.15;
            }

            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += 0.05;
                    if (positions[i] > 55) {
                        positions[i] = 5;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.rotation.y = elapsedTime * 0.05;
            }

            if (isTransitioning) {
                transitionProgress += 0.02;
                if (transitionProgress >= 1) {
                    transitionProgress = 1;
                    isTransitioning = false;
                }
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>

<a id="club-back" href="../index.html#products-shelf" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:2147483647;background:#fff;color:#1d2433;border:2px solid #cfe0f0;border-radius:999px;padding:8px 18px;font:600 15px/1.2 Arial,sans-serif;text-decoration:none;direction:rtl;box-shadow:0 3px 0 #cfe0f0">→ חזרה לאתר החוג</a>
<script>if (window.top !== window) document.getElementById("club-back").remove();</script>
</body>
</html>
