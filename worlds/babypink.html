<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טירת הנסיכה הוורודה הענקית בתלת-ממד</title>
    <!-- Tailwind CSS for UI overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Rubik for clean Hebrew typography -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            overflow: hidden;
            background-color: #ffe4e1;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Custom scrollbar for room descriptions */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 10px;
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 md:p-6">
        
        <!-- Top Bar: Title & Status -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-white/80 backdrop-blur-md px-6 py-4 rounded-3xl shadow-lg border-2 border-pink-300 pointer-events-auto transition-all duration-300">
            <div class="flex items-center gap-3 mb-2 md:mb-0">
                <div class="bg-pink-500 text-white p-3 rounded-2xl shadow-md animate-bounce">
                    <i class="fa-solid fa-chess-rook text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-pink-700">טירת הנסיכה הקסומה (Baby Pink Castle)</h1>
                    <p class="text-xs md:text-sm text-pink-500 font-medium">עולם תלת-ממד ענק, פפיונים, חדרים מהוממים וחצר ענקית!</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-3 py-1 bg-pink-100 text-pink-600 rounded-full text-xs font-semibold border border-pink-300 flex items-center gap-1">
                    <i class="fa-solid fa-circle text-[8px] text-pink-500 animate-ping"></i> פעיל בתלת-ממד
                </span>
            </div>
        </header>

        <!-- Room Navigation Guide / Quick Jump Menu (Bottom/Side) -->
        <nav class="self-center md:self-end bg-white/85 backdrop-blur-md p-4 rounded-3xl shadow-xl border-2 border-pink-300 pointer-events-auto max-w-sm w-full md:w-80 transition-all duration-300">
            <h2 class="text-sm font-bold text-pink-700 mb-3 flex items-center gap-2 border-b border-pink-200 pb-2">
                <i class="fa-solid fa-map-location-dot text-pink-500"></i> מדריך סיור בטירה (לחץ למעבר מהיר)
            </h2>
            <div class="grid grid-cols-2 gap-2 text-xs font-medium">
                <button onclick="teleportCamera(0, 10, 45)" class="flex items-center gap-2 p-2.5 rounded-2xl bg-pink-50 hover:bg-pink-500 hover:text-white text-pink-700 border border-pink-200 transition-all shadow-sm">
                    <i class="fa-solid fa-tree text-pink-500 group-hover:text-white"></i> חצר ראשית
                </button>
                <button onclick="teleportCamera(0, 6, 22)" class="flex items-center gap-2 p-2.5 rounded-2xl bg-pink-50 hover:bg-pink-500 hover:text-white text-pink-700 border border-pink-200 transition-all shadow-sm">
                    <i class="fa-solid fa-door-open text-pink-500"></i> שער ראשי
                </button>
                <button onclick="teleportCamera(0, 12, 5)" class="flex items-center gap-2 p-2.5 rounded-2xl bg-pink-50 hover:bg-pink-500 hover:text-white text-pink-700 border border-pink-200 transition-all shadow-sm">
                    <i class="fa-solid fa-bed text-pink-500"></i> חדר שינה מלכותי
                </button>
                <button onclick="teleportCamera(12, 12, 5)" class="flex items-center gap-2 p-2.5 rounded-2xl bg-pink-50 hover:bg-pink-500 hover:text-white text-pink-700 border border-pink-200 transition-all shadow-sm">
                    <i class="fa-solid fa-bath text-pink-500"></i> אמבטיה ושירותים
                </button>
                <button onclick="teleportCamera(-12, 12, 5)" class="flex items-center gap-2 p-2.5 rounded-2xl bg-pink-50 hover:bg-pink-500 hover:text-white text-pink-700 border border-pink-200 transition-all shadow-sm">
                    <i class="fa-solid fa-utensils text-pink-500"></i> חדר אוכל מפואר
                </button>
                <button onclick="teleportCamera(-12, 6, -12)" class="flex items-center gap-2 p-2.5 rounded-2xl bg-pink-50 hover:bg-pink-500 hover:text-white text-pink-700 border border-pink-200 transition-all shadow-sm">
                    <i class="fa-solid fa-kitchen-set text-pink-500"></i> מטבח ורוד ענק
                </button>
            </div>
            <div class="mt-3 pt-2 border-t border-pink-200 text-center">
                <p class="text-[11px] text-pink-500">💡 טיפ: השתמש בעכבר לסיבוב המצלמה, גלילה לקירוב/תרחוק, וגרירה ימנית להזזה.</p>
            </div>
        </nav>

        <!-- Footer / Instructions -->
        <footer class="self-center bg-white/70 backdrop-blur-sm px-4 py-2 rounded-full shadow border border-pink-200 pointer-events-auto text-xs text-pink-600 font-medium flex items-center gap-3">
            <span>🎀 עיצוב ורוד בייבי מלא בפפיונים</span>
            <span>•</span>
            <span>מומלץ לדפדפנים מודרניים</span>
        </footer>

    </div>

    <!-- JavaScript Application for Three.js World -->
    <script>
        // Global variables for Three.js scene, camera, renderer, and controls
        let scene, camera, renderer, controls;
        const objectsToAnimate = [];

        // Color Palette (Baby Pink, Rose Pink, Soft White, Magenta Accents)
        const PALETTE = {
            babyPink: 0xffb6c1,
            hotPink: 0xff69b4,
            lightPink: 0xffc0cb,
            mistyRose: 0xffe4e1,
            deepPink: 0xff1493,
            white: 0xffffff,
            gold: 0xffd700,
            mint: 0xe0fff0,
            lawn: 0xfff0f5,
            roofDark: 0xff8fa3
        };

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(PALETTE.mistyRose);
            scene.fog = new THREE.FogExp2(PALETTE.mistyRose, 0.015);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 50);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. OrbitControls Setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02; // Don't go below ground
            controls.minDistance = 5;
            controls.maxDistance = 120;
            controls.target.set(0, 8, 0);

            // 5. Lighting
            setupLighting();

            // 6. Build Environment & Castle
            buildCourtyard();
            buildMassiveCastle();

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize);

            // 8. Start Animation Loop
            animate();
        }

        function setupLighting() {
            // Ambient light for soft overall pink hue
            const ambientLight = new THREE.AmbientLight(0xfff0f5, 0.7);
            scene.add(ambientLight);

            // Main directional sunlight with shadows
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(30, 50, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 40;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Pink point lights for magical fairy-tale glowing atmosphere
            const pointLight1 = new THREE.PointLight(PALETTE.hotPink, 1.5, 50);
            pointLight1.position.set(0, 15, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(PALETTE.babyPink, 1.2, 60);
            pointLight2.position.set(-15, 10, -15);
            scene.add(pointLight2);
            
            const pointLight3 = new THREE.PointLight(PALETTE.gold, 1, 40);
            pointLight3.position.set(15, 10, -15);
            scene.add(pointLight3);
        }

        // --- HELPER: Create a Pink Bow (פפיון ורוד) ---
        function createPinkBow(material) {
            const bowGroup = new THREE.Group();
            const bowMat = material || new THREE.MeshStandardMaterial({ color: PALETTE.deepPink, roughness: 0.3, metalness: 0.1 });

            // Center knot
            const knotGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const knot = new THREE.Mesh(knotGeo, bowMat);
            bowGroup.add(knot);

            // Left loop
            const loopGeo = new THREE.TorusGeometry(0.5, 0.18, 16, 32, Math.PI * 2);
            const leftLoop = new THREE.Mesh(loopGeo, bowMat);
            leftLoop.position.set(-0.6, 0.2, 0);
            leftLoop.rotation.z = Math.PI / 4;
            leftLoop.scale.set(1, 0.6, 1);
            bowGroup.add(leftLoop);

            // Right loop
            const rightLoop = new THREE.Mesh(loopGeo, bowMat);
            rightLoop.position.set(0.6, 0.2, 0);
            rightLoop.rotation.z = -Math.PI / 4;
            rightLoop.scale.set(1, 0.6, 1);
            bowGroup.add(rightLoop);

            // Ribbon tails
            const tailGeo = new THREE.BoxGeometry(0.2, 1.2, 0.05);
            const leftTail = new THREE.Mesh(tailGeo, bowMat);
            leftTail.position.set(-0.3, -0.8, 0);
            leftTail.rotation.z = 0.3;
            bowGroup.add(leftTail);

            const rightTail = new THREE.Mesh(tailGeo, bowMat);
            rightTail.position.set(0.3, -0.8, 0);
            rightTail.rotation.z = -0.3;
            bowGroup.add(rightTail);

            bowGroup.scale.set(0.8, 0.8, 0.8);
            return bowGroup;
        }

        // --- COURTYARD & GARDEN ---
        function buildCourtyard() {
            // Huge pinkish ground
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xffe6f0, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Castle stone courtyard pathway (Circular plaza + entrance path)
            const pathGeo = new THREE.RingGeometry(5, 25, 32);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xffd1dc, roughness: 0.7 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.y = 0.02;
            path.receiveShadow = true;
            scene.add(path);

            // Entrance straight path
            const straightPathGeo = new THREE.PlaneGeometry(8, 30);
            const straightPath = new THREE.Mesh(straightPathGeo, pathMat);
            straightPath.rotation.x = -Math.PI / 2;
            straightPath.position.set(0, 0.03, 20);
            straightPath.receiveShadow = true;
            scene.add(straightPath);

            // Cute pink magical trees around courtyard
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 35 + (i % 2) * 8;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                createMagicalTree(x, z);
            }

            // Fountain in the front courtyard
            createFountain(0, 0, 12);
        }

        function createMagicalTree(x, z) {
            const treeGroup = new THREE.Group();

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.7, 4, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.8 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Pink fluffy foliage (Multiple spheres for cotton-candy look)
            const foliageMat = new THREE.MeshStandardMaterial({ color: PALETTE.hotPink, roughness: 0.5 });
            const f1 = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 16), foliageMat);
            f1.position.y = 4.5;
            f1.castShadow = true;
            treeGroup.add(f1);

            const f2 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), foliageMat);
            f2.position.set(1.2, 5.2, 0);
            treeGroup.add(f2);

            const f3 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 16), foliageMat);
            f3.position.set(-1.2, 5, 0);
            treeGroup.add(f3);

            // Add a cute little bow on top of the tree
            const bow = createPinkBow();
            bow.position.set(0, 6.8, 0);
            treeGroup.add(bow);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        function createFountain(x, y, z) {
            const fountainGroup = new THREE.Group();

            // Pool base
            const poolGeo = new THREE.CylinderGeometry(5, 5.5, 1.2, 32);
            const poolMat = new THREE.MeshStandardMaterial({ color: PALETTE.white, roughness: 0.3 });
            const pool = new THREE.Mesh(poolGeo, poolMat);
            pool.position.y = 0.6;
            pool.castShadow = true;
            pool.receiveShadow = true;
            fountainGroup.add(pool);

            // Water inside pool
            const waterGeo = new THREE.CylinderGeometry(4.7, 4.7, 0.8, 32);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x87ceeb, roughness: 0.1, transparent: true, opacity: 0.8 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.position.y = 0.8;
            fountainGroup.add(water);

            // Center pillar
            const pillarGeo = new THREE.CylinderGeometry(0.8, 1, 5, 16);
            const pillar = new THREE.Mesh(pillarGeo, poolMat);
            pillar.position.y = 2.5;
            fountainGroup.add(pillar);

            // Top basin
            const topBasinGeo = new THREE.CylinderGeometry(2, 1.5, 0.8, 16);
            const topBasin = new THREE.Mesh(topBasinGeo, poolMat);
            topBasin.position.y = 4.5;
            fountainGroup.add(topBasin);

            // Giant bow on fountain pillar
            const bow = createPinkBow();
            bow.position.set(0, 3, 1);
            fountainGroup.add(bow);

            fountainGroup.position.set(x, y, z);
            scene.add(fountainGroup);
        }

        // --- MASSIVE BABY PINK CASTLE & ROOMS ---
        function buildMassiveCastle() {
            const castleGroup = new THREE.Group();

            // Materials
            const wallMat = new THREE.MeshStandardMaterial({ color: PALETTE.babyPink, roughness: 0.6 });
            const trimMat = new THREE.MeshStandardMaterial({ color: PALETTE.white, roughness: 0.4 });
            const roofMat = new THREE.MeshStandardMaterial({ color: PALETTE.roofDark, roughness: 0.4 });
            const goldMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold, metalness: 0.8, roughness: 0.2 });

            // 1. MAIN CASTLE STRUCTURE (Central Block - Multi-Level)
            // Ground floor & Upper floors spanning rooms
            const mainBodyGeo = new THREE.BoxGeometry(26, 14, 20);
            const mainBody = new THREE.Mesh(mainBodyGeo, wallMat);
            mainBody.position.set(0, 7, 0);
            mainBody.castShadow = true;
            mainBody.receiveShadow = true;
            castleGroup.add(mainBody);

            // Decorative White Trims & Cornices
            const trimGeo = new THREE.BoxGeometry(27, 0.8, 21);
            const trim1 = new THREE.Mesh(trimGeo, trimMat);
            trim1.position.set(0, 7, 0);
            castleGroup.add(trim1);

            const trimRoof = new THREE.Mesh(trimGeo, trimMat);
            trimRoof.position.set(0, 14, 0);
            castleGroup.add(trimRoof);

            // 2. CORNER TOWERS (4 Massive Towers)
            const towerPositions = [
                [-14, 0, -10],
                [14, 0, -10],
                [-14, 0, 10],
                [14, 0, 10]
            ];

            towerPositions.forEach((pos, idx) => {
                const towerGroup = createTower(wallMat, roofMat, goldMat, 18, 2.5);
                towerGroup.position.set(pos[0], pos[1], pos[2]);
                castleGroup.add(towerGroup);
            });

            // 3. GRAND ENTRANCE GATE & ARCHWAY
            const gateArchGroup = new THREE.Group();
            
            const archPillarGeo = new THREE.BoxGeometry(2, 9, 2);
            const p1 = new THREE.Mesh(archPillarGeo, trimMat);
            p1.position.set(-3.5, 4.5, 10.1);
            gateArchGroup.add(p1);

            const p2 = new THREE.Mesh(archPillarGeo, trimMat);
            p2.position.set(3.5, 4.5, 10.1);
            gateArchGroup.add(p2);

            const archTopGeo = new THREE.BoxGeometry(9, 2, 2.2);
            const archTop = new THREE.Mesh(archTopGeo, trimMat);
            archTop.position.set(0, 9.5, 10.1);
            gateArchGroup.add(archTop);

            // Giant bow above the grand entrance gate
            const entranceBow = createPinkBow();
            entranceBow.position.set(0, 11, 10.5);
            entranceBow.scale.set(1.5, 1.5, 1.5);
            gateArchGroup.add(entranceBow);

            // Double Wooden/Pink Castle Doors
            const doorGeo = new THREE.BoxGeometry(5, 7, 0.4);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.5 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 3.5, 10.1);
            gateArchGroup.add(door);

            castleGroup.add(gateArchGroup);

            // 4. BUILD INTERIOR ROOMS & FURNITURE INSIDE THE CASTLE
            // We slice open or place exquisite detailed furniture inside the open back/front views of rooms:
            // Right Side: Luxury Bathroom & Shower
            buildBathroom(12, 1, 0);

            // Center/Top: Grand Bedroom
            buildBedroom(0, 7, 0);

            // Left Side: Gorgeous Dining Room
            buildDiningRoom(-12, 1, 0);

            // Back/Left Side: Fully-Equipped Pink Kitchen
            buildKitchen(-12, 1, -10);

            scene.add(castleGroup);
        }

        function createTower(wallMat, roofMat, goldMat, height, radius) {
            const towerGroup = new THREE.Group();

            // Cylinder body
            const bodyGeo = new THREE.CylinderGeometry(radius, radius, height, 32);
            const body = new THREE.Mesh(bodyGeo, wallMat);
            body.position.y = height / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            towerGroup.add(body);

            // Conical Roof
            const roofGeo = new THREE.ConeGeometry(radius + 0.8, 7, 32);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = height + 3.5;
            roof.castShadow = true;
            towerGroup.add(roof);

            // Golden Spire on top
            const spireGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const spire = new THREE.Mesh(spireGeo, goldMat);
            spire.position.y = height + 7.2;
            towerGroup.add(spire);

            // Cute Bow on Tower balcony/trim
            const bow = createPinkBow();
            bow.position.set(0, height - 1, radius);
            towerGroup.add(bow);

            return towerGroup;
        }

        // --- ROOM 1: GRAND BEDROOM (חדר שינה מלכותי) ---
        function buildBedroom(x, y, z) {
            const roomGroup = new THREE.Group();

            // Bed Frame
            const bedBaseGeo = new THREE.BoxGeometry(6, 1.2, 7);
            const whiteMat = new THREE.MeshStandardMaterial({ color: PALETTE.white, roughness: 0.3 });
            const bedBase = new THREE.Mesh(bedBaseGeo, whiteMat);
            bedBase.position.set(0, y, z - 4);
            bedBase.castShadow = true;
            roomGroup.add(bedBase);

            // Mattress & Pink Pillows/Blanket
            const mattressGeo = new THREE.BoxGeometry(5.6, 0.8, 6.6);
            const pinkMat = new THREE.MeshStandardMaterial({ color: PALETTE.hotPink, roughness: 0.5 });
            const mattress = new THREE.Mesh(mattressGeo, pinkMat);
            mattress.position.set(0, y + 0.9, z - 4);
            roomGroup.add(mattress);

            // Fluffy white pillows with bows
            const pillowGeo = new THREE.BoxGeometry(2, 0.5, 1.5);
            const p1 = new THREE.Mesh(pillowGeo, whiteMat);
            p1.position.set(-1.5, y + 1.4, z - 6.5);
            p1.rotation.x = -0.2;
            roomGroup.add(p1);

            const p2 = new THREE.Mesh(pillowGeo, whiteMat);
            p2.position.set(1.5, y + 1.4, z - 6.5);
            p2.rotation.x = -0.2;
            roomGroup.add(p2);

            // Gorgeous Heart/Canopy Crown above bed
            const crownBow = createPinkBow();
            crownBow.position.set(0, y + 4.5, z - 7);
            crownBow.scale.set(2, 2, 2);
            roomGroup.add(crownBow);

            // Bedside table with cute lamp
            const tableGeo = new THREE.CylinderGeometry(0.8, 0.8, 2, 16);
            const table = new THREE.Mesh(tableGeo, whiteMat);
            table.position.set(4, y + 1, z - 6);
            roomGroup.add(table);

            const lampGeo = new THREE.ConeGeometry(0.6, 1.2, 16);
            const lampMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold, emissive: 0xffaa00, emissiveIntensity: 0.5 });
            const lamp = new THREE.Mesh(lampGeo, lampMat);
            lamp.position.set(4, y + 2.6, z - 6);
            roomGroup.add(lamp);

            roomGroup.position.set(x, 0, z);
            scene.add(roomGroup);
        }

        // --- ROOM 2: LUXURY BATHROOM & SHOWER (חדר רחצה ושירותים יוקרתי) ---
        function buildBathroom(x, y, z) {
            const roomGroup = new THREE.Group();
            const whiteMat = new THREE.MeshStandardMaterial({ color: PALETTE.white, roughness: 0.2 });
            const goldMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold, metalness: 0.8 });

            // 1. Bathtub (אמבטיה מפוארת על רגלי זהב)
            const tubGeo = new THREE.BoxGeometry(5, 2.2, 3);
            const tub = new THREE.Mesh(tubGeo, whiteMat);
            tub.position.set(x, y + 1.1, z - 4);
            tub.castShadow = true;
            roomGroup.add(tub);

            // Inner water simulation in tub
            const waterGeo = new THREE.BoxGeometry(4.6, 1.8, 2.6);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x87ceeb, roughness: 0.1, transparent: true, opacity: 0.8 });
            const tubWater = new THREE.Mesh(waterGeo, waterMat);
            tubWater.position.set(x, y + 1.2, z - 4);
            roomGroup.add(tubWater);

            // Golden Faucet
            const faucetGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2);
            const faucet = new THREE.Mesh(faucetGeo, goldMat);
            faucet.position.set(x, y + 2.6, z - 5.6);
            roomGroup.add(faucet);

            // 2. Toilet (אסלה מעוצבת ורודה-לבנה)
            const toiletBaseGeo = new THREE.BoxGeometry(1.6, 2, 2);
            const toilet = new THREE.Mesh(toiletBaseGeo, whiteMat);
            toilet.position.set(x - 4, y + 1, z + 3);
            roomGroup.add(toilet);

            const tankGeo = new THREE.BoxGeometry(1.6, 1.8, 0.8);
            const tank = new THREE.Mesh(tankGeo, whiteMat);
            tank.position.set(x - 4, y + 2.8, z + 3.8);
            roomGroup.add(tank);

            // Cute bow on bathroom mirror frame
            const mirrorGeo = new THREE.BoxGeometry(2.5, 3.5, 0.2);
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xd0e8ff, metalness: 0.9, roughness: 0.1 });
            const mirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            mirror.position.set(x, y + 5, z - 7.9);
            roomGroup.add(mirror);

            const mirrorBow = createPinkBow();
            mirrorBow.position.set(x, y + 7, z - 7.9);
            roomGroup.add(mirrorBow);

            scene.add(roomGroup);
        }

        // --- ROOM 3: GORGEOUS DINING ROOM (חדר אוכל מפואר) ---
        function buildDiningRoom(x, y, z) {
            const roomGroup = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xffd1dc, roughness: 0.5 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: PALETTE.white, roughness: 0.3 });

            // Long Dining Table
            const tableGeo = new THREE.BoxGeometry(7, 0.4, 4);
            const table = new THREE.Mesh(tableGeo, woodMat);
            table.position.set(x, y + 2.5, z);
            table.castShadow = true;
            roomGroup.add(table);

            // Table Legs
            for (let dx of [-3, 3]) {
                for (let dz of [-1.6, 1.6]) {
                    const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 2.5);
                    const leg = new THREE.Mesh(legGeo, whiteMat);
                    leg.position.set(x + dx, y + 1.25, z + dz);
                    roomGroup.add(leg);
                }
            }

            // Cake/Dessert Stand in center of table with giant bow
            const cakeBaseGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2);
            const cakeBase = new THREE.Mesh(cakeBaseGeo, whiteMat);
            cakeBase.position.set(x, y + 2.8, z);
            roomGroup.add(cakeBase);

            const cakeGeo = new THREE.CylinderGeometry(0.9, 0.9, 1.2);
            const cakeMat = new THREE.MeshStandardMaterial({ color: PALETTE.hotPink, roughness: 0.4 });
            const cake = new THREE.Mesh(cakeGeo, cakeMat);
            cake.position.set(x, y + 3.5, z);
            roomGroup.add(cake);

            const tableBow = createPinkBow();
            tableBow.position.set(x, y + 4.5, z);
            tableBow.scale.set(0.8, 0.8, 0.8);
            roomGroup.add(tableBow);

            // Dining Chairs (4 chairs)
            const chairPositions = [
                [x - 2, y, z - 2.5, 0],
                [x + 2, y, z - 2.5, 0],
                [x - 2, y, z + 2.5, Math.PI],
                [x + 2, y, z + 2.5, Math.PI]
            ];

            chairPositions.forEach(pos => {
                const chair = createChair(whiteMat);
                chair.position.set(pos[0], pos[1], pos[2]);
                chair.rotation.y = pos[3];
                roomGroup.add(chair);
            });

            scene.add(roomGroup);
        }

        function createChair(material) {
            const chairGroup = new THREE.Group();
            const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.2), material);
            seat.position.y = 1.5;
            chairGroup.add(seat);

            const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.2), material);
            back.position.set(0, 2.3, -0.5);
            chairGroup.add(back);

            for (let dx of [-0.5, 0.5]) {
                for (let dz of [-0.5, 0.5]) {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5), material);
                    leg.position.set(dx, 0.75, dz);
                    chairGroup.add(leg);
                }
            }
            return chairGroup;
        }

        // --- ROOM 4: FULLY-EQUIPPED PINK KITCHEN (מטבח ורוד ענק מאובזר) ---
        function buildKitchen(x, y, z) {
            const roomGroup = new THREE.Group();
            const pinkMat = new THREE.MeshStandardMaterial({ color: PALETTE.hotPink, roughness: 0.4 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: PALETTE.white, roughness: 0.3 });
            const silverMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });

            // Kitchen Counter
            const counterGeo = new THREE.BoxGeometry(8, 3, 3);
            const counter = new THREE.Mesh(counterGeo, pinkMat);
            counter.position.set(x, y + 1.5, z);
            counter.castShadow = true;
            roomGroup.add(counter);

            // Countertop surface
            const topGeo = new THREE.BoxGeometry(8.4, 0.4, 3.4);
            const top = new THREE.Mesh(topGeo, whiteMat);
            top.position.set(x, y + 3.1, z);
            roomGroup.add(top);

            // Refrigerator
            const fridgeGeo = new THREE.BoxGeometry(3, 7, 3);
            const fridge = new THREE.Mesh(fridgeGeo, whiteMat);
            fridge.position.set(x - 4.5, y + 3.5, z - 1);
            fridge.castShadow = true;
            roomGroup.add(fridge);

            // Cute bow on refrigerator door
            const fridgeBow = createPinkBow();
            fridgeBow.position.set(x - 4.5, y + 4.5, z + 0.6);
            roomGroup.add(fridgeBow);

            // Oven / Stove top elements
            const stoveGeo = new THREE.BoxGeometry(3, 3.5, 3);
            const stove = new THREE.Mesh(stoveGeo, silverMat);
            stove.position.set(x + 2, y + 1.7, z);
            roomGroup.add(stove);

            scene.add(roomGroup);
        }

        // --- INTERACTIVE TELEPORT / CAMERA ANIMATION ---
        function teleportCamera(targetX, targetY, targetZ) {
            // Smoothly animate camera position using simple lerp in animation loop or direct jump with controls target
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(targetX, targetY + 5, targetZ + 15);
            const targetLookAt = new THREE.Vector3(targetX, targetY, targetZ);

            let progress = 0;
            function animateTransition() {
                progress += 0.05;
                camera.position.lerpVectors(startPos, endPos, progress);
                controls.target.lerp(targetLookAt, progress);
                controls.update();

                if (progress < 1) {
                    requestAnimationFrame(animateTransition);
                }
            }
            animateTransition();
        }

        // Window resize handler
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate objects slightly for magical floating effect if any
            objectsToAnimate.forEach(obj => {
                obj.rotation.y += 0.01;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize on load
        window.onload = init;
    </script>
