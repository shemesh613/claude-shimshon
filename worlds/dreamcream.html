<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדר החלומות של בנות - הדמיה תלת מימדית</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Heebo -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #fdfbf7;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(255, 253, 250, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(234, 218, 196, 0.6);
        }
        .dark-mode .glass-panel {
            background: rgba(30, 28, 26, 0.88);
            border: 1px solid rgba(217, 163, 102, 0.3);
            color: #fef3c7;
        }
    </style>
</head>
<body class="relative select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Header & Controls -->
    <div class="absolute top-4 right-4 left-4 flex flex-col md:flex-row justify-between items-center pointer-events-none gap-4 z-10">
        
        <!-- Title & Description Card -->
        <div class="glass-panel p-4 rounded-2xl shadow-xl pointer-events-auto max-w-md transition-all duration-300">
            <h1 class="text-2xl font-bold text-amber-700 dark:text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> חדר החלומות של בנות
            </h1>
            <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">
                ברוכות הבאות לחדר בעיצוב שמנת חמים וקסום! סובבו עם העכבר, התקרבו ולחצו על פריטים בחדר כדי לקיים עמם אינטראקציה.
            </p>
        </div>

        <!-- Interactive Controls Bar -->
        <div class="glass-panel p-3 rounded-2xl shadow-xl pointer-events-auto flex items-center gap-3 flex-wrap">
            <button id="mode-toggle" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-xl shadow transition flex items-center gap-2">
                <i class="fa-solid fa-moon" id="mode-icon"></i> <span id="mode-text">מצב לילה / אורות</span>
            </button>
            <button id="color-toggle" class="px-4 py-2 bg-rose-400 hover:bg-rose-500 text-white font-medium rounded-xl shadow transition flex items-center gap-2">
                <i class="fa-solid fa-palette"></i> <span>החלף צבע קיר</span>
            </button>
            <button id="reset-cam" class="p-2 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-xl shadow transition" title="איפוס מבט">
                <i class="fa-solid fa-house"></i>
            </button>
        </div>
    </div>

    <!-- Interactive Hint Toast -->
    <div id="toast" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md px-6 py-3 rounded-full shadow-lg border border-amber-200 dark:border-amber-500/30 text-amber-800 dark:text-amber-300 font-medium text-sm transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-lightbulb"></i> <span id="toast-msg">טיפ: לחצו על פריטים בחדר כדי לקיים איתם אינטראקציה!</span>
    </div>

    <!-- Main JavaScript Logic using Three.js -->
    <script>
        // Ensure dependencies are loaded safely
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof THREE === 'undefined') {
                document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;"><h2>שגיאת טעינה</h2><p>לא ניתן לטעון את ספריית התלת-מימד Three.js. אנא בדקו את חיבור האינטרנט ורעננו את הדף.</p></div>';
                return;
            }

            initSimulation();
        });

        function initSimulation() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfdfbf7); // Cream background

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(13, 11, 15);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Orbit Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.04;
            controls.minDistance = 5;
            controls.maxDistance = 26;
            controls.target.set(0, 2, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xfffbf0, 1.1);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff7ed, 0.85);
            sunLight.position.set(12, 18, 12);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 35;
            const d = 12;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            const deskLampLight = new THREE.PointLight(0xffedd5, 1.8, 7);
            deskLampLight.position.set(-3.5, 3.8, -2.5);
            scene.add(deskLampLight);

            const ceilingLight = new THREE.PointLight(0xfffaed, 0.7, 18);
            ceilingLight.position.set(0, 6.5, 0);
            scene.add(ceilingLight);

            // Materials Palette (Cream & Warm tones)
            const materials = {
                floor: new THREE.MeshStandardMaterial({ color: 0xf5eedc, roughness: 0.35 }),
                wallCream: new THREE.MeshStandardMaterial({ color: 0xfbf7f0, roughness: 0.9 }),
                wallWarmBeige: new THREE.MeshStandardMaterial({ color: 0xf4eee1, roughness: 0.9 }),
                wallSoftPeach: new THREE.MeshStandardMaterial({ color: 0xfceee9, roughness: 0.9 }),
                whiteWood: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
                pastelPink: new THREE.MeshStandardMaterial({ color: 0xffb5a7, roughness: 0.4 }),
                pastelLavender: new THREE.MeshStandardMaterial({ color: 0xcdb4db, roughness: 0.4 }),
                pastelBlue: new THREE.MeshStandardMaterial({ color: 0xb5e2fa, roughness: 0.4 }),
                gold: new THREE.MeshStandardMaterial({ color: 0xe0a96d, metalness: 0.7, roughness: 0.25 }),
                mirror: new THREE.MeshStandardMaterial({ color: 0xd8bfd8, metalness: 0.9, roughness: 0.1 }),
                screen: new THREE.MeshBasicMaterial({ color: 0x1e1b4b })
            };

            const roomWidth = 10;
            const roomDepth = 10;
            const roomHeight = 6;

            // Floor
            const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), materials.floor);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Back Wall (Cream)
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomHeight), materials.wallCream);
            backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Left Wall (Warm Beige)
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, roomHeight), materials.wallWarmBeige);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // --- Rug ---
            const rug = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 0.05, 32), new THREE.MeshStandardMaterial({ color: 0xfffcf5, roughness: 0.9 }));
            rug.position.set(0, 0.03, 1);
            rug.receiveShadow = true;
            rug.userData = { name: "שטיח שמנת פרוותי", type: "rug" };
            scene.add(rug);

            // --- Cozy Bed with Canopy Frame ---
            const bedGroup = new THREE.Group();
            bedGroup.userData = { name: "מיטה מפנקת עם חופה", type: "bed" };

            const frame = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.8, 5.2), materials.whiteWood);
            frame.position.set(-2.5, 0.4, -1.5);
            frame.castShadow = true;
            frame.receiveShadow = true;
            bedGroup.add(frame);

            const headboard = new THREE.Mesh(new THREE.BoxGeometry(4.4, 2.6, 0.4), materials.pastelLavender);
            headboard.position.set(-2.5, 1.3, -4);
            headboard.castShadow = true;
            bedGroup.add(headboard);

            const mattress = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.7, 4.9), new THREE.MeshStandardMaterial({ color: 0xfff5ee, roughness: 0.8 }));
            mattress.position.set(-2.5, 0.95, -1.5);
            mattress.castShadow = true;
            bedGroup.add(mattress);

            const pillowGeo = new THREE.BoxGeometry(1.2, 0.35, 1.0);
            const p1 = new THREE.Mesh(pillowGeo, new THREE.MeshStandardMaterial({ color: 0xfffdfa, roughness: 0.9 }));
            p1.position.set(-3.2, 1.35, -3.2);
            p1.rotation.y = 0.1;
            p1.castShadow = true;
            bedGroup.add(p1);

            const p2 = new THREE.Mesh(pillowGeo, new THREE.MeshStandardMaterial({ color: 0xcdb4db }));
            p2.position.set(-1.8, 1.35, -3.2);
            p2.rotation.y = -0.1;
            p2.castShadow = true;
            bedGroup.add(p2);

            // Canopy Posts
            const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 4.8);
            const cp1 = new THREE.Mesh(postGeo, materials.gold);
            cp1.position.set(-4.3, 2.4, -3.8);
            bedGroup.add(cp1);
            const cp2 = new THREE.Mesh(postGeo, materials.gold);
            cp2.position.set(-0.7, 2.4, -3.8);
            bedGroup.add(cp2);
            const cp3 = new THREE.Mesh(postGeo, materials.gold);
            cp3.position.set(-4.3, 2.4, 0.8);
            bedGroup.add(cp3);
            const cp4 = new THREE.Mesh(postGeo, materials.gold);
            cp4.position.set(-0.7, 2.4, 0.8);
            bedGroup.add(cp4);

            scene.add(bedGroup);

            // --- Desk & Study Area ---
            const deskGroup = new THREE.Group();
            deskGroup.userData = { name: "שולחן כתיבה ומחשב", type: "desk" };

            const deskTop = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, 2), materials.whiteWood);
            deskTop.position.set(3, 2, -4);
            deskTop.castShadow = true;
            deskTop.receiveShadow = true;
            deskGroup.add(deskTop);

            const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 2);
            [ [1.2, -3.2], [4.8, -3.2], [1.2, -4.8], [4.8, -4.8] ].forEach(pos => {
                const leg = new THREE.Mesh(legGeo, materials.gold);
                leg.position.set(pos[0], 1, pos[1]);
                leg.castShadow = true;
                deskGroup.add(leg);
            });

            // Laptop
            const laptopBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.9), materials.gold);
            laptopBase.position.set(3, 2.1, -4);
            deskGroup.add(laptopBase);

            const laptopScreen = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.05), materials.screen);
            laptopScreen.position.set(3, 2.5, -4.4);
            laptopScreen.rotation.x = -0.2;
            deskGroup.add(laptopScreen);

            // Study Lamp
            const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.1, 16), materials.gold);
            lampBase.position.set(1.6, 2.13, -4.2);
            deskGroup.add(lampBase);

            const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0xffb5a7, roughness: 0.3, side: THREE.DoubleSide }));
            lampShade.position.set(1.6, 3.2, -4.2);
            lampShade.rotation.x = 0.3;
            lampShade.userData = { name: "מנורת שולחן מעוצבת", type: "lamp" };
            deskGroup.add(lampShade);

            scene.add(deskGroup);

            // --- Wardrobe ---
            const wardrobe = new THREE.Mesh(new THREE.BoxGeometry(3, 4.5, 1.8), materials.wallWarmBeige);
            wardrobe.position.set(4, 2.25, 0.5);
            wardrobe.castShadow = true;
            wardrobe.receiveShadow = true;
            wardrobe.userData = { name: "ארון בגדים בצבע שמנת", type: "wardrobe" };
            scene.add(wardrobe);

            const handleGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4);
            const h1 = new THREE.Mesh(handleGeo, materials.gold);
            h1.rotation.x = Math.PI / 2;
            h1.position.set(3.2, 2.25, -0.38);
            scene.add(h1);
            const h2 = new THREE.Mesh(handleGeo, materials.gold);
            h2.rotation.x = Math.PI / 2;
            h2.position.set(4.8, 2.25, -0.38);
            scene.add(h2);

            // --- Bookshelf ---
            const shelfGroup = new THREE.Group();
            shelfGroup.userData = { name: "ספריית חלומות צבעונית", type: "bookshelf" };
            const shelfFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 4.2, 0.8), materials.whiteWood);
            shelfFrame.position.set(-4, 2.1, 1.8);
            shelfFrame.castShadow = true;
            shelfGroup.add(shelfFrame);

            const bookColors = [0xffb5a7, 0xfcd5ce, 0xf9dcc4, 0xcdb4db, 0xb5e2fa, 0xe2f0cb];
            for (let i = 0; i < 3; i++) {
                const shelfY = 0.6 + i * 1.3;
                for (let j = 0; j < 5; j++) {
                    const bWidth = 0.25 + Math.random() * 0.1;
                    const bHeight = 0.7 + Math.random() * 0.2;
                    const book = new THREE.Mesh(new THREE.BoxGeometry(bWidth, bHeight, 0.5), new THREE.MeshStandardMaterial({ color: bookColors[Math.floor(Math.random() * bookColors.length)] }));
                    book.position.set(-4.8 + j * 0.35 + (bWidth/2), shelfY + (bHeight/2), 1.8);
                    book.castShadow = true;
                    shelfGroup.add(book);
                }
            }
            scene.add(shelfGroup);

            // --- Vanity Mirror ---
            const vanityGroup = new THREE.Group();
            vanityGroup.userData = { name: "פינת איפור ומראה קסומה", type: "vanity" };

            const vanityTable = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.12, 1.2), materials.whiteWood);
            vanityTable.position.set(-3.5, 1.8, 3.5);
            vanityGroup.add(vanityTable);

            const mirrorFrame = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.1, 32), materials.gold);
            mirrorFrame.rotation.x = Math.PI / 2;
            mirrorFrame.position.set(-3.5, 3.2, 3.9);
            vanityGroup.add(mirrorFrame);

            const mirrorGlass = new THREE.Mesh(new THREE.CircleGeometry(0.8, 32), materials.mirror);
            mirrorGlass.position.set(-3.5, 3.2, 3.92);
            vanityGroup.add(mirrorGlass);
            scene.add(vanityGroup);

            // --- Fairy Lights ---
            const fairyLightsGroup = new THREE.Group();
            const lightBallGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const lightBallMat = new THREE.MeshBasicMaterial({ color: 0xfffae6 });

            const curvePoints = [
                new THREE.Vector3(-4.5, 5.5, -4.5),
                new THREE.Vector3(-2.0, 5.8, 0),
                new THREE.Vector3(0, 5.6, 3.5),
                new THREE.Vector3(2.5, 5.8, 1),
                new THREE.Vector3(4.5, 5.5, -3.5)
            ];

            const fairyPointLights = [];
            curvePoints.forEach((pt) => {
                const bulb = new THREE.Mesh(lightBallGeo, lightBallMat);
                bulb.position.copy(pt);
                fairyLightsGroup.add(bulb);

                const pointLight = new THREE.PointLight(0xffeab0, 0.9, 3.5);
                pointLight.position.copy(pt);
                fairyLightsGroup.add(pointLight);
                fairyPointLights.push(pointLight);
            });
            scene.add(fairyLightsGroup);

            // --- Raycasting Interaction ---
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');

            window.addEventListener('click', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj && !obj.userData?.name && obj.parent) {
                        obj = obj.parent;
                    }

                    if (obj && obj.userData && obj.userData.name) {
                        toastMsg.innerText = `נבחר: ${obj.userData.name}! ✨ הפעלה הופעלה בהצלחה`;
                        toast.classList.remove('opacity-0');
                        setTimeout(() => { toast.classList.add('opacity-0'); }, 3500);

                        if (obj.userData.type === 'lamp') {
                            deskLampLight.intensity = deskLampLight.intensity > 0 ? 0 : 2.8;
                        } else if (obj.userData.type === 'rug') {
                            obj.material.color.set(Math.random() * 0xffffff);
                        } else if (obj.userData.type === 'bookshelf') {
                            obj.children.forEach(c => {
                                if (c.geometry && c.geometry.type === 'BoxGeometry' && c !== shelfFrame) {
                                    c.material.color.set(Math.random() * 0xffffff);
                                }
                            });
                        }
                    }
                }
            });

            // --- Day / Night Toggle ---
            let isNightMode = false;
            document.getElementById('mode-toggle').addEventListener('click', () => {
                isNightMode = !isNightMode;
                document.body.classList.toggle('dark-mode', isNightMode);
                const modeIcon = document.getElementById('mode-icon');
                const modeText = document.getElementById('mode-text');

                if (isNightMode) {
                    scene.background.set(0x1a1715);
                    ambientLight.color.set(0x3d3228);
                    ambientLight.intensity = 0.4;
                    sunLight.intensity = 0.1;
                    ceilingLight.intensity = 2.0;
                    deskLampLight.intensity = 3.0;
                    fairyPointLights.forEach(pl => pl.intensity = 1.8);
                    modeIcon.className = "fa-solid fa-sun";
                    modeText.innerText = "מצב יום";
                } else {
                    scene.background.set(0xfdfbf7);
                    ambientLight.color.set(0xfffbf0);
                    ambientLight.intensity = 1.1;
                    sunLight.intensity = 0.85;
                    ceilingLight.intensity = 0.7;
                    deskLampLight.intensity = 1.8;
                    fairyPointLights.forEach(pl => pl.intensity = 0.9);
                    modeIcon.className = "fa-solid fa-moon";
                    modeText.innerText = "מצב לילה / אורות";
                }
            });

            // --- Wall Color Cycling ---
            const wallColors = [materials.wallCream, materials.wallWarmBeige, materials.wallSoftPeach];
            let colorIdx = 0;
            document.getElementById('color-toggle').addEventListener('click', () => {
                colorIdx = (colorIdx + 1) % wallColors.length;
                backWall.material = wallColors[colorIdx];
                leftWall.material = wallColors[(colorIdx + 1) % wallColors.length];
                toastMsg.innerText = "גווני השמנת והחמימות עודכנו בהצלחה! 🎨";
                toast.classList.remove('opacity-0');
                setTimeout(() => { toast.classList.add('opacity-0'); }, 2500);
            });

            // --- Reset Camera ---
            document.getElementById('reset-cam').addEventListener('click', () => {
                camera.position.set(13, 11, 15);
                controls.target.set(0, 2, 0);
                controls.update();
            });

            // --- Window Resize ---
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // --- Animation Loop ---
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                fairyLightsGroup.children.forEach((child, idx) => {
                    if (child.geometry && child.geometry.type === 'SphereGeometry') {
                        child.position.y += Math.sin(elapsedTime * 2.5 + idx) * 0.0025;
                    }
                });

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>

<a id="club-back" href="../index.html#products-shelf" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:2147483647;background:#fff;color:#1d2433;border:2px solid #cfe0f0;border-radius:999px;padding:8px 18px;font:600 15px/1.2 Arial,sans-serif;text-decoration:none;direction:rtl;box-shadow:0 3px 0 #cfe0f0">→ חזרה לאתר החוג</a>
<script>if (window.top !== window) document.getElementById("club-back").remove();</script>
</body>
</html>
