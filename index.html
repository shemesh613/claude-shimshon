    <p>השיעורים, הכלים והשירים שלנו.</p>

    <a href="#tools-shelf" data-section-tab="tools-shelf">כלים</a>
  </nav>

  <section class="shelf" id="lessons-shelf" data-section-panel>
    <div class="shelf-head"><span class="icon sm coral">

    <div class="shelf-head"><span class="icon sm sun">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>

  <section class="shelf" id="tools-shelf" data-section-panel>
    <div class="shelf-head"><span class="icon sm sky">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.3-2.3a4 4 0 0 0-5-5L2 10l8-8z"/></svg>
